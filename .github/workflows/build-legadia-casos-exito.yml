name: Build Legadia Casos de Exito

on:
  push:
    branches:
      - main
    paths:
      - legadia-casos-exito/generate.py
      - legadia-casos-exito/trigger.txt
      - .github/workflows/build-legadia-casos-exito.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip python-docx

      - name: Generate deliverables
        run: python legadia-casos-exito/generate.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legadia-casos-exito/output
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generar entrega pública Casos de Éxito [skip ci]"
            git push
          fi
